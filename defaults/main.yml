---
# General Defaults
install_reboot: false
install_path: "{{ ansible_facts['env']['PATH'] }}"

# APT Defaults
install_apt_autoremove: false
install_apt_update: false
install_apt_upgrade: "no"

# Git Defaults
install_git: false
install_git_dir: "{{ ansible_facts['env']['HOME'] ~ '/Tools' }}"
install_git_binaries_dir: "{{ install_git_dir ~ '/Binaries' }}"

# GoLang Defaults
install_golang: false
install_golang_path: "{{ ansible_facts['env']['HOME'] ~ '/go/bin:/usr/local/go/bin' }}"
install_golang_batch_size: 1

# Pipx Defaults
install_pipx: false

# Ruby Defaults
install_ruby: false

# Rust Defaults
install_rust: false
install_rust_path: "{{ ansible_facts['env']['HOME'] ~ '/.cargo/bin' }}"

# Catch-all
install_full_path: "{{ install_path ~ ':' ~ install_golang_path ~ ':' ~ install_rust_path }}"
